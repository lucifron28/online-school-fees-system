name: Foundation CI

on:
  workflow_dispatch:
  push:
    branches: ['*', 'main', 'feat/*', 'fix/*']
  pull_request:
    branches: ['*', 'main', 'feat/*', 'fix/*']

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osfs_demo
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osfs_test
      BETTER_AUTH_SECRET: ci-only-fictional-secret-32-characters-minimum
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test
      ENABLE_MOCK_PAYMENT_HARNESS: 'true'
      ENABLE_STUDENT_PORTAL: 'true'
      NEXT_PUBLIC_ENABLE_DEMO_NAV: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create dedicated PostgreSQL databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres osfs_demo
          createdb -h localhost -U postgres osfs_test

      - name: Apply application migrations
        run: pnpm db:migrate

      - name: Seed application demo database
        run: pnpm db:seed

      - name: Apply integration database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osfs_test
        run: pnpm db:migrate

      - name: Safely reset and seed integration database
        env:
          TEST_DB_RESET_CONFIRMATION: RESET_TEST_DATABASE
        run: pnpm db:test:reset

      - name: Re-run seed and verify PostgreSQL contracts
        run: |
          pnpm db:seed
          pnpm db:verify:migrations
          pnpm auth:verify
          pnpm admin:verify
          pnpm students-fees:verify
          pnpm assessments-ledger:verify
          pnpm payments-receipts:verify
          pnpm portals-online:verify
          pnpm reports-reconciliation:verify
          pnpm notifications:verify
          pnpm deadlines-announcements:verify
          pnpm payment-submissions:verify

      - name: Reset integration database before test suite
        env:
          TEST_DB_RESET_CONFIRMATION: RESET_TEST_DATABASE
        run: pnpm db:test:reset

      - name: Check Formatting
        run: pnpm format:check

      - name: Run Linting
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Run Database Integration Tests
        run: pnpm test:integration

      - name: Production Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: pnpm test:e2e

      - name: Repeat isolated Maya rejection browser test
        run: >-
          pnpm exec playwright test tests/e2e/authenticated-workflows.spec.ts --grep
          "browser-only UI rejects a manual Maya proof" --repeat-each=10

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
